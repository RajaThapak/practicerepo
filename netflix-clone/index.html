<!DOCTYPE html>
<html>
    <head>
        <title>Netflix</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id = "container">
            <header id = "myheader">
                <h1 id = "logo">NETFLIX</h1>
                <select id = "language">
                    <option value = "en">English</option>
                    <option value = "hi">Hindi</option>
                </select>
                <button style="margin-left: auto; margin-right: 20px; background-color: red; color:aliceblue; border: none;  cursor: pointer; border-radius:5px; font-weight: bold; padding: 10px 20px; font-size: 16px;">Sign In</button>
            </header>
            <div id = "main">
                <div id = "main-text">
                    <h1 id = "main-heading">Unlimited movies, <br>shows and more</h1>
                    <h3 style = "color: aliceblue;">Starts at ₹149. Cancel at any time.</h3>
                    <p style = "color: aliceblue;">Ready to watch? Enter your email to create or restart your membership.</p>
                </div>
                <div id = "main-form">
                    <input type = "text" placeholder = "Email address" id = "email">
                    <button id = "get-started">Get Started ></button>

                </div>
            </div>
        </div>
    </body>
</html>
